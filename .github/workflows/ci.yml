name: CI

on:
  workflow_call:
  push:
    # main 的检查由发布工作流调用,避免同一提交重复执行两套 CI。
    branches: [master, develop, 'feat/**']
  pull_request:
    branches: [main, master, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect runner resources
        run: free -h && nproc

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test with coverage
        run: pnpm test:coverage --maxWorkers=2

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Authenticated room smoke
        run: pnpm exec playwright test tests/e2e/room-api.spec.ts --project chromium --workers=1

      - name: Build plugin MCP
        run: pnpm build:plugin
        env:
          SGS_PUBLIC_URL: wss://ci-placeholder/ws

      - name: Validate plugin
        run: pnpm validate:plugin
